# Napi delta — az aznap hatályba lépő új időállapotok commitolása.
# Ez a fájl a godavid/gitjog repó packages/pipeline/adatrepo/napi-delta.yml
# másolata; a kettőt egy körben kell frissíteni (a gitjog kapuk.yml heti
# `cmp`-je jelzi az elcsúszást). A beépített GITHUB_TOKEN commitol
# (contents: write) és riaszt issue-val (issues: write). Az egyetlen titok az
# opcionális NYILT_DB_URL a keresőindex-szinkronhoz; ha nincs, a delta kihagyja.
name: Napi delta

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC = kora hajnal magyar idő szerint
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: napi-delta
  cancel-in-progress: false

jobs:
  delta:
    runs-on: ubuntu-latest
    # A réteges enumerálás (index/enumeralas.json) miatt egy normál futás
    # ~20-25 perc; a tartalék a heti körforgás csúcsnapjaira és az njt lassulására megy.
    timeout-minutes: 120
    steps:
      - name: Adat-repo checkout
        # A delta ebbe a checkoutba commitol és pushol, ezért a hitelesítő adat
        # szándékosan megmarad; artifactot a workflow nem tölt fel.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          path: adat
          fetch-depth: 0 # az index SHA-térképéhez teljes history kell

      - name: Pipeline-kód checkout (gitjog)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: godavid/gitjog
          path: kod
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: kod/pnpm-lock.yaml

      - name: Függőségek
        working-directory: kod
        # A `...` a workspace-függőségek (@gitjog/szoveg) saját csomagjait is
        # telepíti — nélküle a keresőindex-szinkron `diff` nélkül hasal el.
        run: pnpm install --frozen-lockfile --filter "@gitjog/pipeline..."

      - name: Delta futtatása
        working-directory: kod
        run: pnpm --filter @gitjog/pipeline delta
        env:
          NYILT_ADAT_REPO_DIR: ${{ github.workspace }}/adat
          NYILT_CACHE_DIR: ${{ runner.temp }}/njt-cache
          GITHUB_TOKEN: ${{ github.token }}
          # keresőindex-szinkron; ha nincs beállítva, a delta kihagyja
          NYILT_DB_URL: ${{ secrets.NYILT_DB_URL }}

      - name: Index-integritás
        working-directory: kod
        run: pnpm --filter @gitjog/pipeline index-ellenorzes
        env:
          NYILT_ADAT_REPO_DIR: ${{ github.workspace }}/adat
